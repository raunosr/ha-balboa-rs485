name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m tools.dev test -q
      - run: python -m tools.dev lint
      - run: python -m tools.package --check
  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-ha-test.txt
            pyproject.toml
      - run: python -m pip install -e '.[dev]' -r requirements-ha-test.txt
      - run: python -m pytest tests_ha --ignore=tests_ha/test_installation.py -q --timeout=30 --cov --cov-config=tests_ha/coverage.ini
      - run: python -m pytest tests_ha/test_installation.py -q --timeout=30
        if: ${{ !cancelled() }}
      - run: python -m mypy custom_components/balboa_rs485 --follow-imports=silent --python-version 3.14
        if: ${{ !cancelled() }}
